<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crocus Counselling | Hope & Healing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #FDFCF8;
            --sage: #B2AC88;
            --charcoal: #36454F;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--cream);
            color: var(--charcoal);
            font-family: 'Lato', sans-serif;
            line-height: 1.6;
        }

        .hero {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: linear-gradient(rgba(253, 252, 248, 0.94), rgba(253, 252, 248, 0.94)), 
                        url('https://images.unsplash.com/photo-1551009033-68f76012e802?auto=format&fit=crop&q=80&w=2000');
            background-size: cover;
            background-position: center;
        }

        .poem-container {
            max-width: 800px;
            text-align: center;
        }

        .poem-label {
            font-size: 0.8rem;
            letter-spacing: 0.4em;
            color: var(--sage);
            margin-bottom: 3rem;
            text-transform: uppercase;
        }

        .poem-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.4rem;
            line-height: 1.3;
            font-style: italic;
            color: var(--charcoal);
            font-weight: 300;
        }

        .poem-text p {
            margin-bottom: 2rem;
        }

        .poem-attribution {
            margin-top: 2rem;
            font-family: 'Lato', sans-serif;
            font-weight: 300;
            letter-spacing: 0.15em;
            color: var(--sage);
            font-size: 0.9rem;
        }

        nav {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 3rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            color: var(--charcoal);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 3.5rem;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--charcoal);
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .cta-button {
            margin-top: 5rem;
            display: inline-block;
            padding: 1.2rem 4rem;
            border: 1px solid var(--sage);
            color: var(--sage);
            text-decoration: none;
            letter-spacing: 0.3em;
            font-size: 0.8rem;
            transition: all 0.5s ease;
        }

        .cta-button:hover {
            background-color: var(--sage);
            color: white;
        }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="logo">CROCUS COUNSELLING</a>
        <div class="nav-links">
            <a href="#">About</a>
            <a href="#">Specialties</a>
            <a href="#">Fees</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    <section class="hero">
        <div class="poem-container">
            <div class="poem-label">The Courage of the Crocus</div>
            <div class="poem-text">
                <p>It takes courage<br>to be crocus-minded.</p>
                <p>But crocuses?<br>Highly irregular.<br>Knifing through hard-frozen ground and snow,<br>and sticking their necks out,<br>because they believe in spring.</p>
            </div>
            <div class="poem-attribution">— Jo Sorley</div>
            <a href="#" class="cta-button">BEGIN YOUR JOURNEY</a>
        </div>
    </section>

</body>
</html>
